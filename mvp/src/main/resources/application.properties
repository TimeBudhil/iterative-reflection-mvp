spring.application.name=mvp
spring.profiles.default=dev

# Persistence: schema comes only from Flyway (src/main/resources/db/migration); Hibernate just validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# OpenAPI / Swagger UI are off unless a profile (dev) turns them on
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Pagination for every list endpoint: default 20, max 100 (larger sizes are clamped)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
# Page<T> responses serialize as {content: [...], page: {size, number, totalElements, totalPages}}
spring.data.web.pageable.serialization-mode=via-dto

# Errors: RFC 7807 problem+json, never leak internals
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Actuator: health is public, everything else is ADMIN-only (see SecurityConfig)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# Logging: one JSON object per line; the MDC requestId (see RequestIdFilter) becomes a top-level field
logging.structured.format.console=logstash
spring.main.banner-mode=off

# Sessions: Spring Session JDBC (tables come from Flyway, never auto-created); idle timeout is the store-level backstop
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# CORS: the only browser origin allowed to call the API with credentials
app.frontend-origin=http://localhost:5173

# Bootstrap admin (R9.1): created once at startup when set; the password must be 12..72 chars or startup fails
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Identity: minimum signup age
identity.minimum-age=13
