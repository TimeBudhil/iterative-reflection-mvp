# prod: PostgreSQL, connection settings from the environment (no code changes needed)
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Behind a reverse proxy the login IP limit must see the real client address: the proxy has to set X-Forwarded-For
# (and X-Forwarded-Proto). Set to "none" if the app is exposed directly, otherwise clients could spoof their address.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# Only health (public) and prometheus (ADMIN) are exposed
management.endpoints.web.exposure.include=health,prometheus

# Session cookie is only sent over HTTPS
server.servlet.session.cookie.secure=true
