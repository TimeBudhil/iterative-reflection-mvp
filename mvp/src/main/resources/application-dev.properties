# dev: file-based H2 in PostgreSQL mode (so sessions and data survive a restart; delete ./data to reset) so migrations
# stay portable to Postgres
spring.datasource.url=jdbc:h2:file:./data/mvp-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Demo accounts (admin, counselor, 2 linked students; password "demo"); idempotent, dev only (R10.1)
app.demo-seed.enabled=true

# API contract for the frontend
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
