# Front door for the rehearsal: https://localhost, /api/* -> Spring, everything else -> Next.
# The backend only accepts a mutation if Origin matches the request's own scheme/host/port, so it must see the
# PUBLIC host (`localhost`) and `X-Forwarded-Proto: https`. Never forward the upstream's name as Host.

server {
    listen 80;
    server_name localhost;
    return 301 https://localhost$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # $remote_addr (not $proxy_add_x_forwarded_for) so a client cannot spoof its address to the login limiter.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location / {
        proxy_pass http://frontend:3000;
    }
}
